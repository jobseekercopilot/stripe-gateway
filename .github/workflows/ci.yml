name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned contract policy
        run: ./scripts/test-contract-policy.sh
      - name: Verify pinned producer contracts
        run: ./scripts/verify-contracts.sh
      - name: Test provider API contract policy
        run: ./scripts/test-api-contract-policy.sh
      - name: Verify reviewed provider API contract
        run: ./scripts/verify-api-contract.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Reject copied build artefacts
        run: |
          test -z "$(find . -path './.git' -prune -o \( -name target -o -name libs -o -name '*.jar' -o -name '*.class' \) -print)"
      - name: Prove deterministic client generation
        run: ./scripts/test-client-generation.sh
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify generated provider API contract
        run: ./scripts/verify-api-contract.sh contracts/openapi.json target/openapi.json
      - name: Build source-only container
        run: docker build --tag local/stripe-gateway:ci .
